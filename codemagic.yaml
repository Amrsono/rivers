workflows:
  ios-capacitor-build:
    name: iOS App Build (.ipa)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        NEXT_TELEMETRY_DISABLED: 1
        NODE_ENV: production
      node: 22.x
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci --legacy-peer-deps

      - name: Build Next.js static output
        script: |
          npm run build

      - name: Sync Capacitor iOS platform
        script: |
          npx cap sync ios

      - name: Compile Xcode Archive & Package Unsigned IPA
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Rivers-Unsigned.ipa Payload

    artifacts:
      - ios/App/Rivers-Unsigned.ipa
